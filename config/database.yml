# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: db/development.sqlite3
  frames:
    adapter: mysql2
    encoding: utf8
    username: collectionsuser
    password: <%= Rails.application.credentials[:DB1PW] %>
    host: ycba-collections-db.ctsmybupmova.us-east-1.rds.amazonaws.com
    database: ycba_collections_db
    port: 3306
    sslca: /Users/ermadmix/Documents/RubymineProjects/cia-solr/config/global-bundle.pem

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: db/test.sqlite3

production:
  primary:
    <<: *default
    database: db/production.sqlite3
  frames:
    adapter: mysql2
    encoding: utf8
    username: collectionsuser
    password: <%= Rails.application.credentials[:DB1PW] %>
    host: ycba-collections-db.ctsmybupmova.us-east-1.rds.amazonaws.com
    database: ycba_collections_db
    port: 3306
    sslca: /app/prod-cia-solr/cia-solr/config/global-bundle.pem